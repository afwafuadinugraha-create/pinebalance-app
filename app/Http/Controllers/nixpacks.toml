providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "composer", "php82-extensions gd"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-req=ext-gd"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && apache2-foreground"